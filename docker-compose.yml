services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.4
    container_name: keycloak
    env_file:
      - .env
    command:
      - start-dev
      # - start
      - --import-realm
      # - --hostname=localhost 
      # - --hostname-strict=false 
      # - --https-certificate-file=/opt/keycloak/certs/keycloak.crt 
      # - --https-certificate-key-file=/opt/keycloak/certs/keycloak.key 
      # - --https-port=8443 
      # - --http-enabled=false 
    depends_on:
      - keycloak-db
    #dev only
    ports:
      - "8085:8080"
      # - "8085:8443"
    networks:
      - archium-network
    # labels:
    #   - "traefik.enable=true"
    volumes:
      - ./exports/realm-export.json:/opt/keycloak/data/import/realm-export.json
      # - ./certs:/opt/keycloak/certs

  keycloak-db:
    image: postgres:15.2
    container_name: keycloak-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${KC_DB_USERNAME}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
      POSTGRES_DB: ${KC_DB_POSTGRES_DB}
    #dev only
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/keycloak_db_data:/var/lib/postgresql/data
    networks:
      - archium-network

  auth-db:
    image: postgres:15.2
    container_name: auth-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${AUTH_DB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_POSTGRES_DB}
    #dev only
    ports:
      - "5433:5432"
    volumes:
      - ./volumes/auth_db_data:/var/lib/postgresql/data
    networks:
      - archium-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_POSTGRES_USER:-postgres} -d ${AUTH_DB_POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
  # auth-api:
  #     container_name: auth-api
  #     build:
  #       context: .
  #     env_file:
  #       - .env
  #     ports:
  #     - "5032:5032"
  #     environment:
  #       AUTH_DB_CONNECTION: Host=auth-db;Database=${AUTH_DB_POSTGRES_DB};Username=${AUTH_DB_POSTGRES_USER};Password=${AUTH_DB_POSTGRES_PASSWORD};Include Error Detail=true
